<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>地面虚拟线</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none}
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #overlay{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #status{
    position:fixed;left:8px;top:8px;right:8px;
    color:#0f0;background:rgba(0,0,0,.65);
    font:12px/1.5 monospace;padding:8px;border-radius:6px;
    white-space:pre-wrap;z-index:10;max-height:40vh;overflow:auto;
  }
  #hud{
    position:fixed;left:8px;bottom:8px;right:8px;
    color:#fff;font:12px/1.4 monospace;
    text-shadow:0 0 4px #000;z-index:10;
  }
  #reset{
    position:fixed;right:12px;bottom:12px;z-index:11;
    padding:10px 16px;border-radius:8px;border:none;
    background:rgba(0,255,136,.85);color:#000;font-weight:bold;font-size:14px;
  }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="status">初始化…</div>
<div id="hud"></div>
<button id="reset">重置朝向</button>

<script>
const video    = document.getElementById('cam');
const canvas   = document.getElementById('overlay');
const ctx      = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const hudEl    = document.getElementById('hud');

let statusText = '';
function setStatus(s){ statusText = s; statusEl.textContent = s; }
function log(s){ statusText += '\n' + s; statusEl.textContent = statusText; }

// ---------- 环境自检 ----------
setStatus('环境自检中…');
log('协议: ' + location.protocol);
log('是否在 iframe: ' + (window.self !== window.top));
log('mediaDevices: ' + (navigator.mediaDevices ? 'OK' : '不存在'));

// ---------- 状态 ----------
let W = 0, H = 0;
let camReady = false;
let dead = false;

// 姿态：原始值（度）
let rawAlpha = 0, rawBeta = 0, rawGamma = 0;

// 校准偏移（点"重置朝向"时把当前值作为前方）
let yawOffset   = 0;
let pitchOffset = 0;

// 屏幕方向角度（0 竖屏, 90 横屏）
let screenAngle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
screen.orientation && screen.orientation.addEventListener('change', ()=>{
  screenAngle = screen.orientation.angle;
});
window.addEventListener('orientationchange', ()=>{
  screenAngle = window.orientation || 0;
});

// ---------- 虚拟线（世界坐标，y=0 地面）----------
// x 向右，z 负方向为玩家前方
const lines = [
  { x1: -2, z1: -2, x2:  2, z2: -2 },
  { x1: -3, z1: -4, x2:  3, z2: -4 },
  { x1: -1, z1: -6, x2: -1, z2: -2 },
];

// ---------- 相机参数 ----------
const CAM_HEIGHT  = 1.4;               // 手机离地高度（米）
const FOV_Y       = 60 * Math.PI/180;  // 垂直视场角
const FOOT_Y_R    = 0.85;              // 脚在画面纵向比例
const LINE_THRESH = 22;                // 判定像素容差
const PITCH_MIN   = 25 * Math.PI/180;  // 低于这个俯角时不判定（手机没朝下不算踩）

// ---------- 姿态监听 ----------
function onOrient(e){
  if (e.alpha === null && e.beta === null && e.gamma === null) return;
  rawAlpha = e.alpha || 0;
  rawBeta  = e.beta  || 0;
  rawGamma = e.gamma || 0;
}
window.addEventListener('deviceorientation', onOrient, true);
window.addEventListener('deviceorientationabsolute', onOrient, true);

document.getElementById('reset').addEventListener('click', ()=>{
  yawOffset   = rawAlpha;
  pitchOffset = rawBeta;
  dead = false;
  log('已重置朝向');
});

// ---------- 世界 -> 相机 -> 屏幕 ----------
// 相机在世界坐标 (0, CAM_HEIGHT, 0)，初始朝向为 -z
function project(wx, wz){
  // 相对相机
  let px = wx;
  let py = -CAM_HEIGHT;
  let pz = wz;

  // 姿态（弧度）
  const d2r = Math.PI / 180;
  const pitch = (rawBeta  - pitchOffset) * d2r;   // 低头看地 -> 正
  const yaw   = (rawAlpha - yawOffset)   * d2r;   // 左转/右转
  // roll 先忽略（影响较小）

  // --- 绕世界 X 轴：pitch（低头时把地面点从下方转到前方视野里） ---
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  let y1 =  py * cp + pz * sp;
  let z1 = -py * sp + pz * cp;

  // --- 绕世界 Y 轴：yaw ---
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  let x2 =  px * cy + z1 * sy;
  let z2 = -px * sy + z1 * cy;

  // 相机看向 -z
  const depth = -z2;
  if (depth <= 0.05) return null;

  // 横竖屏：垂直 FOV 固定，水平视野随宽高比变
  // 但如果手机横屏，垂直方向变成了原来的水平方向，所以要根据 screenAngle 修正
  const focal = (H/2) / Math.tan(FOV_Y/2);

  let sx = W/2 + (x2 / depth) * focal;
  let sy2 = H/2 - (y1 / depth) * focal;

  // 屏幕旋转修正：当手机横屏时，画布坐标系和相机坐标系需要绕屏幕中心旋转
  if (screenAngle === 90){
    const cx0 = W/2, cy0 = H/2;
    const dx = sx - cx0, dy = sy2 - cy0;
    sx  = cx0 - dy;
    sy2 = cy0 + dx;
  } else if (screenAngle === -90 || screenAngle === 270){
    const cx0 = W/2, cy0 = H/2;
    const dx = sx - cx0, dy = sy2 - cy0;
    sx  = cx0 + dy;
    sy2 = cy0 - dx;
  } else if (screenAngle === 180){
    sx  = W - sx;
    sy2 = H - sy2;
  }

  return { x: sx, y: sy2, depth };
}

// ---------- 点到线段距离 ----------
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  if(l2===0) return Math.hypot(px-ax,py-ay);
  let t=((px-ax)*dx+(py-ay)*dy)/l2;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}

// ---------- 每帧 ----------
function frame(){
  if (W !== innerWidth || H !== innerHeight){
    W = canvas.width  = innerWidth;
    H = canvas.height = innerHeight;
  }

  ctx.clearRect(0,0,W,H);

  const d2r = Math.PI / 180;
  const pitch = (rawBeta - pitchOffset) * d2r;
  const lookingDown = pitch > PITCH_MIN;   // 手机朝下才判定

  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.shadowBlur = 12;

  const footX = W/2;
  const footY = H*FOOT_Y_R;
  let onLine = false;

  for (const L of lines){
    const a = project(L.x1, L.z1);
    const b = project(L.x2, L.z2);
    if (!a || !b) continue;

    const isHit = lookingDown &&
                  segDist(footX,footY,a.x,a.y,b.x,b.y) < LINE_THRESH;
    if (isHit) onLine = true;

    ctx.strokeStyle = isHit ? '#ff3344' : '#00ff88';
    ctx.shadowColor = ctx.strokeStyle;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  if (onLine && !dead) dead = true;

  // 脚点
  ctx.shadowBlur = 0;
  ctx.fillStyle = dead ? '#ff3344' : '#ffffff';
  ctx.beginPath();
  ctx.arc(footX, footY, 6, 0, Math.PI*2);
  ctx.fill();

  // 死亡
  if (dead){
    ctx.fillStyle = 'rgba(255,0,0,0.35)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 42px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('你死了', W/2, H/2);
    ctx.font = '16px sans-serif';
    ctx.fillText('点击右下角「重置朝向」继续', W/2, H/2+36);
  }

  hudEl.textContent =
    `yaw ${((rawAlpha-yawOffset)).toFixed(0)}°  ` +
    `pitch ${((rawBeta-pitchOffset)).toFixed(0)}°  ` +
    `cam ${camReady?'OK':'NO'}  ` +
    `angle ${screenAngle}°`;

  requestAnimationFrame(frame);
}

// ---------- 摄像头（多级回退）----------
async function startCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('❌ 摄像头 API 不存在\n' +
              '原因：非 HTTPS/localhost，或在 iframe 被限制\n' +
              '当前：' + location.href);
    return false;
  }

  const tries = [
    { video: { facingMode: { ideal: 'environment' } }, audio:false },
    { video: { facingMode: 'environment' }, audio:false },
    { video: true, audio:false },
  ];

  for (let i=0;i<tries.length;i++){
    try {
      setStatus(`尝试打开摄像头 (${i+1}/${tries.length})…`);
      const stream = await navigator.mediaDevices.getUserMedia(tries[i]);
      video.srcObject = stream;
      await video.play();
      await new Promise(r=>{
        if (video.videoWidth) return r();
        video.onloadedmetadata = r;
        setTimeout(r, 1500);
      });
      camReady = true;
      setStatus('✅ 摄像头 OK  ' + video.videoWidth + 'x' + video.videoHeight);
      return true;
    } catch(err){
      log(`第 ${i+1} 次失败: ${err.name} - ${err.message}`);
    }
  }
  setStatus(statusText + '\n\n❌ 全部尝试失败');
  return false;
}

// ---------- 主流程 ----------
(async ()=>{
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  W = innerWidth; H = innerHeight;

  await startCamera();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
