<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebXR 终极测试 - 基础 AR 会话</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        #info span {
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="info">
        <span>⚡ 终极测试</span> | 基础 AR 会话 (无 hit-test)
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. 基本三件套
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. 放一个可见的红色方块，验证基础 AR 是否工作
        const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(0, 0, -1); // 放在前方1米处
        scene.add(cube);

        // 3. 手动创建启动按钮
        const startButton = document.createElement('button');
        startButton.textContent = '开启基础 AR 会话';
        startButton.style.position = 'absolute';
        startButton.style.bottom = '30px';
        startButton.style.left = '50%';
        startButton.style.transform = 'translateX(-50%)';
        startButton.style.padding = '16px 32px';
        startButton.style.fontSize = '18px';
        startButton.style.fontWeight = '600';
        startButton.style.background = '#ff4d4d';
        startButton.style.color = 'white';
        startButton.style.border = 'none';
        startButton.style.borderRadius = '50px';
        startButton.style.cursor = 'pointer';
        startButton.style.zIndex = '200';
        startButton.style.boxShadow = '0 8px 25px rgba(255, 77, 77, 0.5)';
        document.body.appendChild(startButton);

        // 4. 点击事件：不要求任何特性
        startButton.addEventListener('click', async () => {
            if (!navigator.xr) {
                alert('当前浏览器不支持 WebXR');
                return;
            }

            // 先检查是否支持 immersive-ar
            const supported = await navigator.xr.isSessionSupported('immersive-ar');
            if (!supported) {
                alert('当前浏览器/系统不支持 immersive-ar');
                return;
            }

            try {
                // 关键：不要求任何特性，只请求最基础的 AR 会话
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: [],
                    optionalFeatures: []
                });

                renderer.xr.setReferenceSpaceType('local');
                await renderer.xr.setSession(session);

                // 渲染循环：让方块旋转
                renderer.setAnimationLoop((timestamp, frame) => {
                    cube.rotation.y += 0.01;
                    renderer.render(scene, camera);
                });

                startButton.style.display = 'none'; // 隐藏按钮

            } catch (error) {
                alert('启动失败: ' + error.message);
                console.error('AR 会话启动失败:', error);
            }
        });

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
