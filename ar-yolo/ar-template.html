<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YOLO AR - 阶段 1</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  #video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1; }
  #overlay { position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #hud {
    position:absolute; top:10px; left:10px; z-index:3;
    color:#0f0; font:12px/1.5 monospace;
    background:rgba(0,0,0,0.6); padding:8px 12px; border-radius:6px;
    white-space:pre; pointer-events:none;
  }
  #start {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    z-index:4; padding:14px 32px; font-size:16px; font-weight:600;
    background:#ff4d4d; color:#fff; border:none; border-radius:50px;
    box-shadow:0 8px 25px rgba(255,77,77,0.5);
  }
  #start:disabled { background:#666; box-shadow:none; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="overlay"></canvas>
<div id="hud">等待启动…</div>
<button id="start">开启摄像头</button>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>
<script>
const MODEL_B64 = "__MODEL_B64__";

const INPUT_SIZE = 640;
const CONF_THRESH = 0.35;
const IOU_THRESH = 0.45;
const INFER_INTERVAL = 200;

const COCO_NAMES = [
  "person","bicycle","car","motorcycle","airplane","bus","train","truck","boat",
  "traffic light","fire hydrant","stop sign","parking meter","bench","bird","cat",
  "dog","horse","sheep","cow","elephant","bear","zebra","giraffe","backpack",
  "umbrella","handbag","tie","suitcase","frisbee","skis","snowboard","sports ball",
  "kite","baseball bat","baseball glove","skateboard","surfboard","tennis racket",
  "bottle","wine glass","cup","fork","knife","spoon","bowl","banana","apple",
  "sandwich","orange","broccoli","carrot","hot dog","pizza","donut","cake","chair",
  "couch","potted plant","bed","dining table","toilet","tv","laptop","mouse",
  "remote","keyboard","cell phone","microwave","oven","toaster","sink",
  "refrigerator","book","clock","vase","scissors","teddy bear","hair drier",
  "toothbrush"
];

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");
const hud = document.getElementById("hud");
const startBtn = document.getElementById("start");

let session = null;
let lastResult = [];
let fpsFrames = 0;
let fpsStart = 0;
let currentFps = 0;
let lastInferTime = 0;

function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function loadModel() {
  hud.textContent = "加载模型中…（首次可能 10-20 秒）";
  ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/";
  session = await ort.InferenceSession.create(b64ToBytes(MODEL_B64), {
    executionProviders: ["wasm"]
  });
  hud.textContent = "模型就绪，请点击开启摄像头";
}

function frameToTensor() {
  const c = document.createElement("canvas");
  c.width = INPUT_SIZE;
  c.height = INPUT_SIZE;
  const cx = c.getContext("2d");
  cx.drawImage(video, 0, 0, INPUT_SIZE, INPUT_SIZE);
  const data = cx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
  const f = new Float32Array(3 * INPUT_SIZE * INPUT_SIZE);
  const N = INPUT_SIZE * INPUT_SIZE;
  for (let i = 0; i < N; i++) {
    f[i]         = data[i * 4]     / 255;
    f[i + N]     = data[i * 4 + 1] / 255;
    f[i + N * 2] = data[i * 4 + 2] / 255;
  }
  return new ort.Tensor("float32", f, [1, 3, INPUT_SIZE, INPUT_SIZE]);
}

function decodeYOLOv8(output) {
  const data = output.data;
  const numClasses = 80;
  const numBoxes = 8400;
  const boxes = [];
  const scores = [];
  const classIds = [];

  for (let i = 0; i < numBoxes; i++) {
    let maxScore = 0;
    let maxClass = -1;
    for (let c = 0; c < numClasses; c++) {
      const s = data[(4 + c) * numBoxes + i];
      if (s > maxScore) { maxScore = s; maxClass = c; }
    }
    if (maxScore < CONF_THRESH) continue;

    const cx = data[0 * numBoxes + i];
    const cy = data[1 * numBoxes + i];
    const w  = data[2 * numBoxes + i];
    const h  = data[3 * numBoxes + i];

    boxes.push([cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2]);
    scores.push(maxScore);
    classIds.push(maxClass);
  }
  return { boxes, scores, classIds };
}

function nms(boxes, scores, thr) {
  const idx = scores.map((_, i) => i).sort((a, b) => scores[b] - scores[a]);
  const keep = [];
  while (idx.length) {
    const i = idx.shift();
    keep.push(i);
    for (let j = idx.length - 1; j >= 0; j--) {
      const k = idx[j];
      const x1 = Math.max(boxes[i][0], boxes[k][0]);
      const y1 = Math.max(boxes[i][1], boxes[k][1]);
      const x2 = Math.min(boxes[i][2], boxes[k][2]);
      const y2 = Math.min(boxes[i][3], boxes[k][3]);
      const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
      const ai = (boxes[i][2] - boxes[i][0]) * (boxes[i][3] - boxes[i][1]);
      const ak = (boxes[k][2] - boxes[k][0]) * (boxes[k][3] - boxes[k][1]);
      if (inter / (ai + ak - inter) > thr) idx.splice(j, 1);
    }
  }
  return keep;
}

async function inferFrame() {
  if (!session || video.readyState < 2) return;
  const t0 = performance.now();

  const tensor = frameToTensor();
  const feeds = {};
  feeds[session.inputNames[0]] = tensor;
  const out = await session.run(feeds);
  const output = out[session.outputNames[0]];

  const { boxes, scores, classIds } = decodeYOLOv8(output);
  const keep = nms(boxes, scores, IOU_THRESH);

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const sx = vw / INPUT_SIZE;
  const sy = vh / INPUT_SIZE;

  lastResult = keep.map(i => ({
    box: [boxes[i][0] * sx, boxes[i][1] * sy, boxes[i][2] * sx, boxes[i][3] * sy],
    score: scores[i],
    cls: classIds[i]
  }));

  const inferMs = (performance.now() - t0).toFixed(0);

  fpsFrames++;
  const now = performance.now();
  if (now - fpsStart >= 1000) {
    currentFps = (fpsFrames * 1000 / (now - fpsStart)).toFixed(1);
    fpsFrames = 0;
    fpsStart = now;
  }

  let info = `推理: ${inferMs}ms  FPS: ${currentFps}\n`;
  info += `检测到: ${lastResult.length} 个物体\n`;
  if (lastResult.length > 0) {
    const top = lastResult[0];
    info += `最高: ${COCO_NAMES[top.cls]} (${(top.score * 100).toFixed(0)}%)`;
  }
  hud.textContent = info;
}

function draw() {
  if (overlay.width !== video.videoWidth || overlay.height !== video.videoHeight) {
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
  }
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  for (const r of lastResult) {
    const [x1, y1, x2, y2] = r.box;
    ctx.strokeStyle = "#00ff88";
    ctx.lineWidth = 3;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

    const label = `${COCO_NAMES[r.cls]} ${(r.score * 100).toFixed(0)}%`;
    ctx.font = "bold 16px sans-serif";
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(x1, y1 - 22, tw + 12, 22);

    ctx.fillStyle = "#00ff88";
    ctx.fillText(label, x1 + 6, y1 - 6);
  }
}

function loop() {
  const now = performance.now();
  if (now - lastInferTime > INFER_INTERVAL) {
    lastInferTime = now;
    inferFrame().catch(e => console.error(e));
  }
  draw();
  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  startBtn.textContent = "启动中…";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = stream;
    await video.play();
    startBtn.style.display = "none";
    loop();
  } catch (e) {
    hud.textContent = "摄像头启动失败: " + e.message;
    startBtn.disabled = false;
    startBtn.textContent = "重试";
  }
});

loadModel().catch(e => {
  hud.textContent = "模型加载失败: " + e.message;
  console.error(e);
});
</script>
</body>
</html>
