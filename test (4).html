<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebXR 绝地重试</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #info {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px 20px; border-radius: 30px;
            z-index: 100; font-family: sans-serif;
        }
        #info span { color: #ff4d4d; font-weight: bold; }
        #log {
            position: absolute; bottom: 100px; left: 20px;
            color: #0f0; font-family: monospace; font-size: 12px;
            background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px;
            max-width: 90%; word-break: break-all; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info"><span>⚡ 绝地重试</span> | 基础 AR 会话</div>
    <div id="log">等待点击...</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const logDiv = document.getElementById('log');
        const log = (msg) => { logDiv.innerHTML = msg; console.log(msg); };

        // 1. 基础三件套
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. 红色方块
        const cube = new THREE.Mesh(
            new THREE.BoxGeometry(0.2, 0.2, 0.2),
            new THREE.MeshBasicMaterial({ color: 0xff0000 })
        );
        cube.position.set(0, 0, -1);
        scene.add(cube);

        // 3. 手动按钮
        const btn = document.createElement('button');
        btn.textContent = '开启基础 AR 会话';
        Object.assign(btn.style, {
            position: 'absolute', bottom: '30px', left: '50%',
            transform: 'translateX(-50%)', padding: '16px 32px',
            fontSize: '18px', fontWeight: '600', background: '#ff4d4d',
            color: 'white', border: 'none', borderRadius: '50px',
            cursor: 'pointer', zIndex: '200',
            boxShadow: '0 8px 25px rgba(255, 77, 77, 0.5)'
        });
        document.body.appendChild(btn);

        // 4. 点击事件
        btn.addEventListener('click', async () => {
            log('检测 navigator.xr...');
            if (!navigator.xr) {
                log('❌ navigator.xr 不存在');
                alert('浏览器不支持 WebXR');
                return;
            }

            log('检测 immersive-ar 支持...');
            try {
                const supported = await navigator.xr.isSessionSupported('immersive-ar');
                log(`immersive-ar 支持: ${supported}`);
                if (!supported) {
                    alert('当前浏览器/系统不支持 immersive-ar');
                    return;
                }
            } catch (e) {
                log(`检测支持时出错: ${e.message}`);
                return;
            }

            log('请求会话中...');
            try {
                // 最基础的会话请求
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: [],
                    optionalFeatures: []
                });
                log('✅ 会话创建成功！');

                renderer.xr.setReferenceSpaceType('local');
                await renderer.xr.setSession(session);
                log('✅ 会话已绑定到渲染器');

                renderer.setAnimationLoop(() => {
                    cube.rotation.y += 0.01;
                    renderer.render(scene, camera);
                });

                btn.style.display = 'none';
            } catch (error) {
                log(`❌ 启动失败: ${error.message}`);
                alert('启动失败: ' + error.message);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
